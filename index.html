<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neural Knowledge Base</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #0a0e27;
        --bg-secondary: #131832;
        --bg-tertiary: #1a1f3a;
        --accent-purple: #a855f7;
        --accent-cyan: #06b6d4;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --border-color: #2d3548;
      }

      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1335 100%);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
      }

      .container {
        max-width: 1600px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 20px;
        height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .panel {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        position: relative;
        overflow: hidden;
      }

      .panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          var(--accent-purple),
          var(--accent-cyan)
        );
      }

      .panel-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--accent-cyan);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-cyan);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(0.8);
        }
      }

      /* URL Input */
      .url-input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .input-wrapper {
        position: relative;
      }

      input[type="text"] {
        width: 100%;
        padding: 12px 16px;
        background: var(--bg-tertiary);
        border: 2px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-primary);
        font-size: 14px;
        transition: all 0.3s ease;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent-purple);
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--accent-purple),
          var(--accent-cyan)
        );
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      /* Status List */
      .status-list {
        max-height: 400px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .status-list::-webkit-scrollbar {
        width: 6px;
      }

      .status-list::-webkit-scrollbar-track {
        background: var(--bg-tertiary);
        border-radius: 3px;
      }

      .status-list::-webkit-scrollbar-thumb {
        background: var(--accent-purple);
        border-radius: 3px;
      }

      .status-item {
        padding: 12px;
        background: var(--bg-tertiary);
        border-radius: 8px;
        border-left: 3px solid var(--accent-purple);
        transition: all 0.3s ease;
      }

      .status-item:hover {
        background: rgba(168, 85, 247, 0.1);
        transform: translateX(4px);
      }

      .status-item.completed {
        border-left-color: var(--accent-green);
      }

      .status-item.pending {
        border-left-color: var(--accent-cyan);
        animation: shimmer 2s linear infinite;
      }

      @keyframes shimmer {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
        100% {
          opacity: 1;
        }
      }

      .status-url {
        font-size: 12px;
        color: var(--text-primary);
        word-break: break-all;
        margin-bottom: 5px;
      }

      .status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .status-badge.pending {
        background: rgba(6, 182, 212, 0.2);
        color: var(--accent-cyan);
      }

      .status-badge.completed {
        background: rgba(16, 185, 129, 0.2);
        color: var(--accent-green);
      }

      /* Chat Area */
      .chat-container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 40px);
      }

      .chat-header {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px 16px 0 0;
        padding: 20px 24px;
        border-bottom: 1px solid var(--border-color);
      }

      .chat-title {
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(
          135deg,
          var(--accent-purple),
          var(--accent-cyan)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        background: var(--bg-secondary);
        border-left: 1px solid var(--border-color);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .chat-messages::-webkit-scrollbar {
        width: 8px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: var(--bg-tertiary);
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background: var(--accent-purple);
        border-radius: 4px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 10px;
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-user {
        align-self: flex-end;
        max-width: 70%;
      }

      .message-bubble {
        padding: 14px 18px;
        border-radius: 16px;
        line-height: 1.5;
      }

      .message-user .message-bubble {
        background: linear-gradient(
          135deg,
          var(--accent-purple),
          var(--accent-cyan)
        );
        color: white;
      }

      .message-assistant {
        align-self: flex-start;
        max-width: 85%;
      }

      .message-assistant .message-bubble {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-color);
      }

      .sources {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .source-chip {
        padding: 8px 14px;
        background: rgba(168, 85, 247, 0.15);
        border: 1px solid var(--accent-purple);
        border-radius: 20px;
        font-size: 11px;
        color: var(--accent-purple);
        text-decoration: none;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .source-chip:hover {
        background: rgba(168, 85, 247, 0.3);
        transform: translateY(-2px);
      }

      .source-icon {
        width: 12px;
        height: 12px;
        background: var(--accent-purple);
        border-radius: 50%;
      }

      /* Chat Input */
      .chat-input-container {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 0 0 16px 16px;
        padding: 20px 24px;
        border-top: 1px solid var(--border-color);
      }

      .chat-input-wrapper {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .chat-input {
        flex: 1;
        padding: 14px 20px;
        background: var(--bg-tertiary);
        border: 2px solid var(--border-color);
        border-radius: 12px;
        color: var(--text-primary);
        font-size: 15px;
        resize: none;
        transition: all 0.3s ease;
      }

      .chat-input:focus {
        outline: none;
        border-color: var(--accent-purple);
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
      }

      .btn-send {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          var(--accent-purple),
          var(--accent-cyan)
        );
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .btn-send:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
      }

      .btn-send svg {
        width: 24px;
        height: 24px;
        fill: white;
      }

      /* Toast */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast {
        padding: 16px 20px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 300px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        animation: toastSlide 0.3s ease;
      }

      @keyframes toastSlide {
        from {
          opacity: 0;
          transform: translateX(100px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .toast.success {
        background: rgba(16, 185, 129, 0.2);
        border: 1px solid var(--accent-green);
      }

      .toast.info {
        background: rgba(6, 182, 212, 0.2);
        border: 1px solid var(--accent-cyan);
      }

      .toast-icon {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .toast.success .toast-icon {
        background: var(--accent-green);
      }

      .toast.info .toast-icon {
        background: var(--accent-cyan);
      }

      .loading-dots {
        display: flex;
        gap: 4px;
      }

      .loading-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-purple);
        animation: bounce 1.4s infinite ease-in-out both;
      }

      .loading-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .loading-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        color: var(--text-secondary);
      }

      .empty-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--accent-purple),
          var(--accent-cyan)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <!-- URL Ingest Panel -->
        <div class="panel">
          <div class="panel-title">
            <div class="pulse-dot"></div>
            Data Ingestion
          </div>
          <div class="url-input-group">
            <input
              type="text"
              id="urlInput"
              placeholder="Enter URL to ingest..."
            />
            <button class="btn btn-primary" onclick="ingestURL()">
              Ingest Knowledge
            </button>
          </div>
        </div>

        <!-- Status Panel -->
        <div
          class="panel"
          style="flex: 1; display: flex; flex-direction: column"
        >
          <div class="panel-title">
            <div class="pulse-dot"></div>
            Ingestion Status
          </div>
          <div class="status-list" id="statusList">
            <div class="empty-state">
              <div class="empty-icon">
                <svg width="32" height="32" fill="white" viewBox="0 0 24 24">
                  <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
                  />
                </svg>
              </div>
              <span>No ingestions yet</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Chat Area -->
      <div class="chat-container">
        <div class="chat-header">
          <div class="chat-title">Neural Knowledge Base</div>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="empty-state">
            <div class="empty-icon">
              <svg width="32" height="32" fill="white" viewBox="0 0 24 24">
                <path
                  d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"
                />
              </svg>
            </div>
            <span>Start a conversation...</span>
          </div>
        </div>
        <div class="chat-input-container">
          <div class="chat-input-wrapper">
            <textarea
              id="chatInput"
              class="chat-input"
              rows="1"
              placeholder="Ask anything..."
            ></textarea>
            <button class="btn-send" onclick="sendMessage()">
              <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
      const API_BASE = "http://localhost:8000";
      let statusCheckInterval;

      // Toast notification
      function showToast(message, type = "info") {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerHTML = `
                <div class="toast-icon">${type === "success" ? "✓" : "ℹ"}</div>
                <div>${message}</div>
            `;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
      }

      // Ingest URL
      async function ingestURL() {
        const input = document.getElementById("urlInput");
        const url = input.value.trim();

        if (!url) {
          showToast("Please enter a valid URL", "info");
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/ingest-data`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: url }),
          });

          if (response.status === 202) {
            showToast(`Ingestion started: ${url}`, "info");
            input.value = "";
            fetchStatus();
            if (!statusCheckInterval) {
              statusCheckInterval = setInterval(fetchStatus, 3000);
            }
          }
        } catch (error) {
          showToast("Failed to start ingestion", "info");
          console.error(error);
        }
      }

      // Fetch status
      async function fetchStatus() {
        try {
          const response = await fetch(`${API_BASE}/get-status`);
          const data = await response.json();
          updateStatusList(data);
        } catch (error) {
          console.error("Failed to fetch status:", error);
        }
      }

      // Update status list
      function updateStatusList(data) {
        const container = document.getElementById("statusList");

        if (data.length === 0) {
          container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg width="32" height="32" fill="white" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                            </svg>
                        </div>
                        <span>No ingestions yet</span>
                    </div>
                `;
          return;
        }

        container.innerHTML = data
          .map(
            (item) => `
                <div class="status-item ${item.status}">
                    <div class="status-url">${item.url}</div>
                    <span class="status-badge ${item.status}">${item.status}</span>
                </div>
            `
          )
          .reverse()
          .join("");

        const hasCompleted = data.some((item, idx) => {
          const prevStatus = container.dataset[`status_${idx}`];
          const nowCompleted =
            item.status === "completed" && prevStatus === "pending";
          container.dataset[`status_${idx}`] = item.status;
          return nowCompleted;
        });

        if (hasCompleted) {
          showToast("Ingestion completed successfully!", "success");
        }
      }

      // Send message
      async function sendMessage() {
        const input = document.getElementById("chatInput");
        const query = input.value.trim();

        if (!query) return;

        const messagesContainer = document.getElementById("chatMessages");
        messagesContainer.innerHTML = messagesContainer.querySelector(
          ".empty-state"
        )
          ? ""
          : messagesContainer.innerHTML;

        // Add user message
        const userMsg = document.createElement("div");
        userMsg.className = "message message-user";
        userMsg.innerHTML = `<div class="message-bubble">${query}</div>`;
        messagesContainer.appendChild(userMsg);
        input.value = "";

        // Add assistant message placeholder
        const assistantMsg = document.createElement("div");
        assistantMsg.className = "message message-assistant";
        assistantMsg.innerHTML = `
                <div class="message-bubble">
                    <div class="loading-dots">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
            `;
        messagesContainer.appendChild(assistantMsg);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
          const response = await fetch(`${API_BASE}/query`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query }),
          });

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let sources = null;
          let responseText = "";

          assistantMsg.innerHTML = '<div class="message-bubble"></div>';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split("\n\n");

            for (const line of lines) {
              if (line.startsWith("data: ")) {
                const data = JSON.parse(line.slice(6));

                if (data.type === "sources") {
                  sources = data.data;
                  const sourcesHTML = sources
                    .map(
                      (s) =>
                        `<a href="${s.url}" target="_blank" class="source-chip">
                                        <div class="source-icon"></div>
                                        ${new URL(s.url).hostname}
                                    </a>`
                    )
                    .join("");
                  assistantMsg.innerHTML = `
                                    <div class="message-bubble">
                                        <div class="sources">${sourcesHTML}</div>
                                    </div>
                                `;
                } else if (data.type === "text") {
                  responseText += data.data;
                  const bubble = assistantMsg.querySelector(".message-bubble");
                  bubble.innerHTML =
                    (sources
                      ? `<div class="sources">${
                          bubble.querySelector(".sources").innerHTML
                        }</div>`
                      : "") +
                    `<div style="margin-top: 10px">${responseText}</div>`;
                }
              }
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
          }
        } catch (error) {
          assistantMsg.innerHTML =
            '<div class="message-bubble">Failed to get response</div>';
          console.error(error);
        }
      }

      // Enter to send
      document.getElementById("chatInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      document.getElementById("urlInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          ingestURL();
        }
      });

      // Initial status fetch
      fetchStatus();
    </script>
  </body>
</html>
